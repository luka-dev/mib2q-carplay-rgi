# CarPlay cluster layout options.  Edit on the SD card, then run this card:
#   M.I.B. -> Advanced Settings -> Run Custom Script.
# A line starting with # does nothing.  Every line left as a comment keeps the built-in value,
# so this file as shipped (everything commented) means "built-in layout" and removes any
# layout file installed earlier.
#
# Safe areas: where the phone keeps the important part of the map (vehicle arrow, cards,
# texts) on the 1440 x 542 cockpit panel.  x y width height, in pixels from the top left.
# The picture itself always fills the panel.  Applies on the NEXT PHONE CONNECTION.
# Rules (a line that breaks one is ignored and the built-in value stays): inside the panel,
# width at least 165, height at least 203, and at least 290 high when narrower than 498.
#
#   full: Audi View = large map.     sport: small map, Sport skin.     classic: small map, Classic skin.
#
# Built-in values (measured on an A5 B9 cockpit by luka), used on A4/A5/Q5 and every car
# without a car profile:
#full    270 90 900 290
#sport    90 90 360 300
#classic 540 90 360 300
#
# Q7 car profile, applied AUTOMATICALLY on a Q7 (the head unit runs the Q7 layout classes),
# nothing to uncomment.  Used on a Q7 4M in the aberbic issue #5 review; a commercial
# A4/A5/Q5/Q7 package ships the same three values, so they are one source, not yet confirmed
# on our Q7:
#   full    360 87 720 297
#   sport   114 88 350 296
#   classic 520 87 400 297
# A full / sport / classic line here overrides the car profile for that area.
#
# car_profile off = ignore the car profile and use the built-in (A5) values, to compare both
# on the same car.  Applies on the next phone connection.
#car_profile auto
#
# Which small-map placement the phone gets.  auto = follow the cockpit skin (Classic/Sport);
# sport / classic = always that one (handy to compare both on one car).  Applies within 2 s.
#compact auto
#
# Where the large/small View state comes from.  Applies within 2 s.
#   auto   = the Audi View button model or the cockpit's own stage report, whichever came last
#   choice = the View button model only (the original behaviour)
#   vc     = the cockpit's stage report only
#view_source auto
#
# The phone's own turn card and ETA, used when Audi turn arrows are not in use (no route, or
# apps without route guidance such as Waze).  Applies on the next phone connection.
#   cards: right | left | center        eta: yes | no
#cards right
#eta yes
#
# Ask the phone to draw a speed-limit sign in the cockpit map (yes | no).  Whether Maps
# draws it on this cockpit is not known yet.  Applies on the next phone connection.
#speed_limit no
