################################################################################
### Macros
################################################################################
int_if     = "mmx0"
wlan_if    = "uap0"
dbg_if     = "en0"
ext_if     = "ecm0"
ex2_if     = "ecm1"
rcc_if     = "10.0.0.16"


################################################################################
### Tables
################################################################################
table <private> const { 10/8, 172.16/12, 192.168/16 }
table <dns_server> persist { 8.8.8.8, 208.67.222.222 }
table <sdis> persist
table <blacklist> persist
table <multicast> persist { 224.0.0.0/4, FF00::/8 }

################################################################################
### Options
################################################################################
# set proper default values
set optimization normal
set block-policy drop
set state-policy if-bound
set fingerprints "/etc/pf.os"
set debug none
#set loginterface $wlan_if

# Skip all PF filtering on loopback device
set skip on lo0


################################################################################
### Traffic normalization
################################################################################
set reassemble yes
scrub in all


################################################################################
### Queue handling
################################################################################
altq on $ext_if priq bandwidth 100Mb queue { wlan_out, wlan_ack, std_out, std_ack, onl_out, onl_ack, ack_ack }
queue wlan_out priority 0 priq(red)
queue wlan_ack priority 3 priq(red)
queue std_out  priority 2 priq(red, default)
queue std_ack  priority 4 priq(red)
queue onl_out  priority 5 priq(red)
queue onl_ack  priority 7 priq(red)
queue ack_ack  priority 8 priq(red)

altq on $wlan_if priq bandwidth 150Mb qlimit 300 queue { default_out, default_ack, med_out, med_ack, high_out, high_ack, video_out, video_ack, audio_out, audio_ack, control_out, control_ack }
queue default_out qlimit  50 priority 0  priq(red, default)
queue default_ack qlimit  50 priority 1  priq(red)
queue med_out     qlimit  75 priority 2  priq(red)
queue med_ack     qlimit  75 priority 4  priq(red)
queue high_out    qlimit 100 priority 3  priq(red)
queue high_ack    qlimit 100 priority 5  priq(red)
queue video_out   qlimit 150 priority 6  priq
queue video_ack   qlimit 150 priority 9  priq
queue audio_out   qlimit 150 priority 7  priq
queue audio_ack   qlimit 150 priority 10 priq
queue control_out qlimit 150 priority 8  priq
queue control_ack qlimit 150 priority 11 priq


################################################################################
### Port forwards
################################################################################
### Port forwards to the RCC
### Port forwards for Harman/Aisin
rdr pass on $dbg_if proto tcp from any to ($dbg_if) port 123 -> $rcc_if port 23
rdr pass on $dbg_if proto {tcp,udp} from any to ($dbg_if) port 851 -> $rcc_if
rdr pass on $dbg_if proto tcp from any to ($dbg_if) port 7800 -> $rcc_if
rdr pass on $dbg_if proto tcp from any to ($dbg_if) port 57005 -> $rcc_if


################################################################################
### NAT rules
################################################################################

## NAT from WLAN to the internet
nat pass on $ext_if tagged WLAN -> ($ext_if)
nat pass on $dbg_if tagged WLAN -> ($dbg_if)
nat pass on $ex2_if tagged WLAN -> ($ex2_if)

nat pass on $ext_if from $rcc_if to any -> ($ext_if)
nat pass on $dbg_if from $rcc_if to any -> ($dbg_if)


################################################################################
### Packet filter rules
################################################################################

########## internal traffic ##########
pass quick on $int_if all allow-opts

########## WLAN ##########
# block all black listed hosts
block in quick on $wlan_if from <blacklist>

# block WLAN to external interfaces (before NAT!)
block in quick on $wlan_if from any to {($ext_if), ($dbg_if), $int_if:network}

# pass through DHCP from WLAN to internal DHCP server
pass in quick on $wlan_if proto udp from any port bootpc to any port bootp keep state allow-opts queue(control_out, control_ack)

# block incoming packets not from WLAN network
block in quick on $wlan_if inet from !($wlan_if:network) to any

# allow ICMP on WLAN interface
pass in quick on $wlan_if inet proto icmp from ($wlan_if:network) to ($wlan_if) keep state allow-opts
pass in quick on $wlan_if inet6 proto ipv6-icmp from any to ($wlan_if) keep state allow-opts

# allow DNS requests
pass in quick on $wlan_if proto {udp,tcp} from ($wlan_if:network) to ($wlan_if) port domain keep state allow-opts queue(control_out, control_ack)

# SSH Access
pass in quick on $ext_if proto tcp from any to ($ext_if) port 22 keep state allow-opts
pass in quick on $wlan_if proto tcp from any to ($wlan_if) port 22 keep state allow-opts
pass in quick on $dbg_if proto tcp from any to ($dbg_if) port 22 keep state allow-opts

# allow UPnP over WLAN
pass in quick on $wlan_if from any to 239.255.255.0/24 allow-opts
pass in quick on $wlan_if proto tcp from any to ($wlan_if) port 49152 keep state allow-opts queue(audio_out, audio_ack)
pass in quick on $wlan_if proto udp from any to ($wlan_if) port 49153:49162 keep state allow-opts queue(audio_out, audio_ack)



# Anchor for blocking EXLAP server
anchor EXLAP in on $wlan_if proto tcp from any to ($wlan_if) port 25010
anchor EXLAP in on $wlan_if proto udp from any to any port 28500

# Allow restricted EXLAP connections
pass in quick on $wlan_if proto tcp from any to ($wlan_if) port 25010 flags S/SA keep state (source-track rule, max-src-nodes 8, max-src-states 9, max-src-conn 8, overload <blacklist> flush) queue(default_out, default_ack)
pass in quick on $wlan_if proto udp from any to any port 28500 keep state (max 90, source-track rule, max-src-nodes 8) allow-opts queue(default_out, default_ack)

block in quick proto tcp from any to any port { 1500:1501, 1504:1505, 31337 }

# WLAN to WLAN traffic
block in quick on $wlan_if from any to ($wlan_if)
pass  in quick on $wlan_if from ($wlan_if:network) to ($wlan_if:network) keep state allow-opts queue(default_out, default_ack)

# let all WLAN packets pass out
pass out quick on $wlan_if all keep state allow-opts

########## external interfaces ##########
# block all tethering data
block quick on mlan0

# pass through DHCP for debug interface/ppp/ecm
pass in  quick on {$ext_if, $ex2_if} proto udp from any port bootp to any port bootpc keep state queue ack_ack
pass out quick on {$ext_if, $ex2_if} proto udp from any port bootpc to any port bootp keep state queue ack_ack

# allow DNS requests
pass out quick on $ex2_if proto {udp,tcp} from ($ex2_if) to any port domain keep state allow-opts queue ack_ack

# SSH Access
pass in quick on $ext_if proto tcp from any to ($ext_if) port 22 keep state allow-opts
pass in quick on $wlan_if proto tcp from any to ($wlan_if) port 22 keep state allow-opts
pass in quick on $dbg_if proto tcp from any to ($dbg_if) port 22 keep state allow-opts

# block multicasts
block quick on {$ext_if, $ex2_if} from any to <multicast>

# block traffic that should go out on debug interface
block drop out quick on $ext_if from ($ext_if) to ($dbg_if:network)
block drop out quick on $ex2_if from ($ex2_if) to ($dbg_if:network)

# block destination unreachable on external interfaces
block drop out quick on $ext_if proto icmp from ($int_if) to ($ext_if)
block drop out quick on $ex2_if proto icmp from ($int_if) to ($ex2_if)

# block outgoing traffic not from ecmX address
block drop out quick on $ext_if from !($ext_if) to any
block drop out quick on $ex2_if from !($ex2_if) to any

################################################################################
### OPEN PORTS
################################################################################
###############################################################################
### FORWARDED PORTS
###############################################################################
### Statelessly let the forwarded ports through the firewall
pass in  quick on $dbg_if proto tcp from any to ($dbg_if) port {123, 851, 7800, 57005} allow-opts
pass out quick on $dbg_if proto tcp from ($dbg_if) port {123, 851, 7800, 57005} to any allow-opts
pass in  quick on $dbg_if proto udp from any to ($dbg_if) port 851 allow-opts
pass out quick on $dbg_if proto udp from ($dbg_if) port 851 to any allow-opts


###############################################################################
### D-LINK PORTS
###############################################################################
# pass through DHCP for debug interface/ppp/ecm
pass in quick on $dbg_if proto udp from any port bootp to any port bootpc keep state queue ack_ack

# block multicasts on D-Link but allow on tethering interface.
block drop quick on $dbg_if from any to 224.0.0.0/4

# block incoming packets from localhost
block in quick on $dbg_if from 127.0.0.0/8 to any

# allow ICMP
pass in quick on $dbg_if inet proto icmp from any to ($dbg_if) keep state allow-opts

# allow incoming traffic in PROD and DEV releases from following ports on ethernet
pass in  quick on $dbg_if proto tcp from any to ($dbg_if) port {23, 1800, 2012, 10123, 15000, 16001, 21002, 22110:22111} allow-opts
pass out quick on $dbg_if proto tcp from ($dbg_if) port {23, 1800, 2012, 10123, 15000, 16001, 21002, 22110:22111} to any allow-opts



# for uninterrupted QXDM tracing
pass in  quick on $dbg_if proto tcp from any port 2500 to ($dbg_if) allow-opts
pass out quick on $dbg_if proto tcp from ($dbg_if) to any port 2500 allow-opts

########## CarPlay ##########
pass in quick on carplay0 proto tcp from any to any port { 5000:5001, 5010, 6000:6001, 6030, 6100, 6200, 7000:7001, 7100 } allow-opts
pass in quick on carplay0 proto udp from any to any port { 67:68, 5001, 6000:6002, 6010:6011, 6020:6021, 7010:7011, 7070:7071, 5353 } allow-opts
pass in quick on carplay0 inet6 proto ipv6-icmp all keep state allow-opts
pass in quick on carplay0 proto tcp from any port 5001 to any allow-opts
block drop in quick on carplay0 all
pass out quick on carplay0 proto {udp,tcp} from any to any port 5001 keep state allow-opts
pass out quick on carplay0 all allow-opts


# default rules
block drop in quick on $dbg_if all
pass out quick on $dbg_if all keep state allow-opts

############# DNS #############
anchor dns_data out on $ext_if from ($ext_if) to <dns_server>
#load anchor dns_data from "/etc/pf.data.default"

############# WLAN #############
anchor wlan_data in on $wlan_if from ($wlan_if:network) to any
#load anchor wlan_data from "/etc/pf.data.default"

############# MMI #############
anchor mmi_data out on $ext_if from ($ext_if) to any
#load anchor mmi_data from "/etc/pf.data.default"

# for redirection (telnet etc.)
pass out quick on $int_if from any to $rcc_if keep state allow-opts

# block incoming packets from NAD
block drop in on {$ext_if, $ex2_if}

